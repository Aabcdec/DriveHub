# ===== 服务端口 =====
server.port=8080

# ===== 数据源 =====
spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.datasource.url=jdbc:mysql://192.168.254.158:3306/dlyk
spring.datasource.username=root
spring.datasource.password=root

# ===== MyBatis =====
mybatis.mapper-locations=classpath:Mapper/*.xml
mybatis.map-underscore-to-camel-case=true
#mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ===== Redis =====
spring.redis.host=192.168.254.158
spring.redis.port=6379

# ===== 敏感配置（密钥等，不入库） =====
spring.profiles.include=secret

# ===== 定时任务：字典/产品缓存刷新 =====
project.task.cron=0 0/5 * * * ?
project.task.delay=180000

# ===== RabbitMQ 消息队列 =====
spring.rabbitmq.host=192.168.254.160
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=12345
spring.rabbitmq.virtual-host=RabbitDemoHost
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.listener.simple.acknowledge-mode=manual



